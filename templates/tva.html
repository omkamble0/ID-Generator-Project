<!-- ========================================== -->
<!-- 1. SIDEBAR FORM: TVA VARIANT ID            -->
<!-- ========================================== -->
<div class="template-specific-form">
    
    <div class="input-group">
        <label>Authority Title</label>
        <input type="text" value="TIME VARIANCE AUTHORITY" oninput="document.querySelectorAll('.sync-tva-header').forEach(el => el.innerText = this.value.toUpperCase())">
    </div>

    <div class="input-group">
        <label>Variant Serial Number</label>
        <input type="text" value="414-620701-401220" oninput="document.querySelectorAll('.sync-tva-serial').forEach(el => el.innerText = this.value.toUpperCase())">
    </div>
    
    <div class="input-group" style="margin-top:20px;">
        <label>Variant Subject Photo</label>
        <input type="file" accept="image/*" onchange="if(this.files[0]){ let r=new FileReader(); r.onload=e=>{ document.querySelectorAll('.sync-tva-photo').forEach(img=>img.src=e.target.result) }; r.readAsDataURL(this.files[0]) }">
    </div>

</div>

<!-- ========================================== -->
<!-- 2. CARD CANVAS: TVA VARIANT ID             -->
<!-- ========================================== -->
<div class="template-specific-card" id="tva-card">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500&display=swap');
        
        .card-scene { width: 330px; height: 520px; perspective: 1000px; font-family: 'Oswald', sans-serif; }
        .card-inner { width: 100%; height: 100%; position: relative; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
        .card-inner.is-flipped { transform: rotateY(180deg); }
        
        .card-face { 
            position: absolute; width: 100%; height: 100%; border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; backface-visibility: hidden;
            background-color: #121212;
        }
        
        .card-front { transform: rotateY(0deg); z-index: 2; }
        .card-back { transform: rotateY(180deg); z-index: 1; }

        .tva-front-img {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background-image: url('loki_tva_id_front (2).png');
            background-size: 100% 100%; background-position: center;
            z-index: 1; pointer-events: none;
        }
        
        .tva-back-img {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background-image: url('loki_tva_id_back (1).png');
            background-size: 100% 100%; background-position: center;
            z-index: 1; pointer-events: none;
        }

        /* ==================== FRONT CARD OVERLAYS ==================== */
        
        .tva-header-blocker {
            position: absolute; top: 4.8%; left: 15%; width: 70%; height: 5.2%;
            background-color: #151616; z-index: 2;
            display: flex; align-items: center; justify-content: center;
            color: #db8a56; font-size: 16px; font-weight: 500; letter-spacing: 1px;
            overflow: hidden; white-space: nowrap;
        }

        .tva-serial-blocker {
            position: absolute; top: 12.8%; left: 21%; width: 58%; height: 3.2%;
            background-color: #e28e57; z-index: 2;
            display: flex; align-items: center; justify-content: center;
            color: #121212; font-size: 14px; font-weight: 500; letter-spacing: 1.5px;
            overflow: hidden; white-space: nowrap;
        }

        /* FIXED: Coordinates strictly confined to the inner copper frame! */
        .tva-photo-box {
            position: absolute; top: 45.2%; left: 23.5%; width: 53%; height: 42.5%;
            z-index: 3; background: #121212; overflow: hidden;
            border-radius: 2px; display: flex; align-items: center; justify-content: center;
        }
        
        .tva-photo-box img {
            width: 100%; height: 100%; object-fit: cover;
            filter: sepia(0.6) hue-rotate(-15deg) saturate(1.2) contrast(1.2) brightness(0.95);
        }
    </style>

    <div class="card-scene">
        <div class="card-inner" id="card-inner">
            
            <div class="card-face card-front">
                <div class="tva-front-img"></div>
                
                <div class="tva-header-blocker sync-tva-header">TIME VARIANCE AUTHORITY</div>
                <div class="tva-serial-blocker sync-tva-serial">414-620701-401220</div>
                
                <div class="tva-photo-box">
                    <img class="sync-tva-photo" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Variant">
                </div>
            </div>

            <div class="card-face card-back">
                <div class="tva-back-img"></div>
            </div>
            
        </div>
    </div>
</div>
