<!-- ========================================== -->
<!-- 1. SIDEBAR FORM: SPOTIFY LYRIC CARD       -->
<!-- ========================================== -->
<div class="template-specific-form">
    
    <div class="input-row">
        <div class="input-group">
            <label>Song Title</label>
            <input type="text" value="See You Again" oninput="document.querySelectorAll('.sync-sp-title').forEach(el => el.innerText = this.value)">
        </div>
        <div class="input-group">
            <label>Artist Name</label>
            <input type="text" value="Tyler, The Creator" oninput="document.querySelectorAll('.sync-sp-artist').forEach(el => el.innerText = this.value)">
        </div>
    </div>

    <div class="input-group" style="margin-top: 10px;">
        <label>Card Background Color</label>
        <div style="display: flex; gap: 10px; margin-top: 5px;">
            <input type="color" value="#e35d6a" style="height: 40px; padding: 0; cursor: pointer; flex: 1;" oninput="document.querySelectorAll('.sync-sp-bg').forEach(el => el.style.backgroundColor = this.value)">
            <select style="flex: 2; padding: 10px; border-radius: 6px; border: 1px solid #ddd;" onchange="document.querySelectorAll('.sync-sp-bg').forEach(el => el.style.backgroundColor = this.value)">
                <option value="#e35d6a">Coral Red</option>
                <option value="#b9133c">Deep Ruby</option>
                <option value="#8e44ad">Purple Velvet</option>
                <option value="#2c3e50">Dark Slate</option>
                <option value="#1db954">Spotify Green</option>
            </select>
        </div>
    </div>

    <div class="input-group" style="margin-top: 10px;">
        <label>Lyrics / Quote</label>
        <textarea style="background: var(--bg-color); border: 1px solid transparent; padding: 14px 16px; font-family: 'Inter', sans-serif; font-size: 0.95rem; border-radius: 6px; color: var(--text-main); width: 100%; height: 100px; resize: vertical;" oninput="document.querySelectorAll('.sync-sp-lyrics').forEach(el => el.innerText = this.value)">Can I get a kiss? And can you make it last forever?</textarea>
    </div>

    <div class="input-group" style="margin-top: 10px;">
        <label>Album Art / Track Cover</label>
        <input type="file" accept="image/*" onchange="if(this.files[0]){ let r=new FileReader(); r.onload=e=>{ document.querySelectorAll('.sync-sp-art').forEach(img=>img.src=e.target.result) }; r.readAsDataURL(this.files[0]) }">
    </div>
</div>

<!-- ========================================== -->
<!-- 2. CARD CANVAS: SPOTIFY LYRIC CARD         -->
<!-- ========================================== -->
<div class="template-specific-card" id="spotify-card">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        
        .card-scene { width: 420px; height: 420px; perspective: 1000px; font-family: 'Inter', sans-serif; }
        
        .card-face { 
            width: 100%; height: 100%; border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.25); overflow: hidden;
            display: flex; flex-direction: column; justify-content: space-between; padding: 35px;
            box-sizing: border-box; color: #ffffff; background-color: #e35d6a;
        }

        .sp-header { display: flex; align-items: center; gap: 14px; }
        .sp-art-box { width: 48px; height: 48px; border-radius: 6px; overflow: hidden; background: #000; flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .sp-art-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        .sp-meta { display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
        .sp-title { font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.2px; }
        .sp-artist { font-weight: 600; font-size: 13px; opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

        .sp-lyrics-container { flex: 1; display: flex; align-items: center; padding: 10px 0; overflow: hidden; }
        .sp-lyrics { 
            font-weight: 900; font-size: 28px; line-height: 1.25; 
            letter-spacing: -0.5px; word-break: break-word;
            display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
        }

        .sp-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
        .sp-logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; letter-spacing: -0.3px; }
        
        /* Perfect Circular Spotify Logo matching reference */
        .sp-logo svg { width: 24px; height: 24px; }
    </style>

    <div class="card-scene">
        <div class="card-face sync-sp-bg">
            <div class="sp-header">
                <div class="sp-art-box">
                    <img class="sync-sp-art" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Cover">
                </div>
                <div class="sp-meta">
                    <div class="sp-title sync-sp-title">See You Again</div>
                    <div class="sp-artist sync-sp-artist">Tyler, The Creator</div>
                </div>
            </div>

            <div class="sp-lyrics-container">
                <div class="sp-lyrics sync-sp-lyrics">Can I get a kiss? And can you make it last forever?</div>
            </div>

            <div class="sp-footer">
                <div class="sp-logo">
                    <!-- Complete Circular Spotify Icon SVG -->
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="12" fill="#ffffff"/>
                        <path d="M16.893 15.756c-.19.302-.596.395-.898.205-2.464-1.507-5.564-1.847-9.215-1.011-.342.078-.669-.138-.747-.48-.078-.342.138-.669.48-.747 3.931-.899 7.406-.511 10.175 1.185.302.19.395.596.205.898zm1.282-3.142c-.244.385-.747.502-1.132.258-2.828-1.737-7.149-2.241-10.493-1.226-.438.132-.904-.112-1.036-.55-.132-.438.112-.904.55-1.036 3.824-1.161 8.654-.593 11.91 1.411.385.244.502.747.258 1.132zm.098-3.324c-3.375-2.003-8.943-2.188-12.164-1.196-.518.157-1.069-.131-1.226-.649-.157-.518.131-1.069.649-1.226 3.655-1.109 9.805-.898 13.722 1.427.472.28.629.894.349 1.366-.28.472-.894.629-1.366.349z" fill="#121212"/>
                    </svg>
                    Spotify
                </div>
            </div>
        </div>
    </div>
</div>
